name: Application Provisioning

# Required GitHub Repository Secrets:
# - AWS_STATE_ACCOUNT_ROLE_ARN: IAM role ARN for backend state operations
# - AWS_PRODUCTION_ACCOUNT_ROLE_ARN: IAM role ARN for production deployments
# - AWS_DEVELOPMENT_ACCOUNT_ROLE_ARN: IAM role ARN for development deployments
# - AWS_ASSUME_EXTERNAL_ID: ExternalId for cross-account role assumption security
# - TF_VAR_POSTGRESQL_PASSWORD: PostgreSQL database password
# - TF_VAR_REDIS_PASSWORD: Redis password for SMS OTP storage
# - TF_VAR_OPENLDAP_ADMIN_PASSWORD: OpenLDAP admin password (for backend ldap-admin-secret)
#
# Optional (first admin user seed - when all are set, a one-time Job seeds the first admin):
# - ADMIN_SEED_USERNAME, ADMIN_SEED_EMAIL, ADMIN_SEED_FIRST_NAME, ADMIN_SEED_LAST_NAME
# - ADMIN_SEED_PHONE_COUNTRY_CODE, ADMIN_SEED_PHONE_NUMBER
# (Password for seed admin = same as TF_VAR_OPENLDAP_ADMIN_PASSWORD; do not log these values.)
#
# Note: GitHub workflows use repository secrets, while bash scripts use AWS Secrets Manager.
# The secrets listed above must be configured in GitHub repository settings.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Select AWS Region'
        required: true
        type: choice
        default: 'us-east-1: N. Virginia'
        options:
          - 'us-east-1: N. Virginia'
          - 'us-east-2: Ohio'
      environment:
        description: 'Select Environment'
        required: true
        type: choice
        default: prod
        options:
          - prod
          - dev

jobs:
  SetRegion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      region_code: ${{ steps.set_region.outputs.region_code }}
    steps:
      - name: Set Region
        id: set_region
        run: |
          SELECTED_REGION="${{ inputs.region }}"
          echo "region_code=${SELECTED_REGION%%:*}" >> $GITHUB_OUTPUT

  ApplicationProvision:
    runs-on: ubuntu-latest
    needs:
      - SetRegion
    permissions:
      contents: write
      actions: write
      id-token: write
    env:
      AWS_REGION: ${{ needs.SetRegion.outputs.region_code }}
      # Note: TF_VAR environment variables are case-sensitive and must match variable names in variables.tf
      # Secrets in GitHub remain uppercase, but environment variables must be lowercase
      # PostgreSQL password for User management database
      TF_VAR_postgresql_database_password: ${{ secrets.TF_VAR_POSTGRESQL_PASSWORD }}
      # Redis password for SMS OTP storage
      TF_VAR_redis_password: ${{ secrets.TF_VAR_REDIS_PASSWORD }}
      # OpenLDAP admin password for backend LDAP bind (ldap-admin-secret)
      TF_VAR_openldap_admin_password: ${{ secrets.TF_VAR_OPENLDAP_ADMIN_PASSWORD }}
      # First admin seed (optional; when all set, one-time Job seeds first admin with same password as LDAP)
      TF_VAR_admin_seed_username: ${{ secrets.ADMIN_SEED_USERNAME }}
      TF_VAR_admin_seed_email: ${{ secrets.ADMIN_SEED_EMAIL }}
      TF_VAR_admin_seed_first_name: ${{ secrets.ADMIN_SEED_FIRST_NAME }}
      TF_VAR_admin_seed_last_name: ${{ secrets.ADMIN_SEED_LAST_NAME }}
      TF_VAR_admin_seed_phone_country_code: ${{ secrets.ADMIN_SEED_PHONE_COUNTRY_CODE }}
      TF_VAR_admin_seed_phone_number: ${{ secrets.ADMIN_SEED_PHONE_NUMBER }}
    defaults:
      run:
        working-directory: ./application
    steps:
      - name: Checkout the repo code
        uses: actions/checkout@v4

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Export environment variables for set-k8s-env.sh
        run: |
          # Export required variables for set-k8s-env.sh (matching setup-application.sh)
          echo "BACKEND_FILE=backend.hcl" >> $GITHUB_ENV
          echo "VARIABLES_FILE=variables.tfvars" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
          echo "TERRAFORM_WORKSPACE=${{ env.AWS_REGION }}-${{ inputs.environment }}" >> $GITHUB_ENV
          echo "BACKEND_PREFIX=${{ vars.BACKEND_PREFIX }}" >> $GITHUB_ENV
          # Determine deployment account role ARN based on environment
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "DEPLOYMENT_ROLE_ARN=${{ secrets.AWS_PRODUCTION_ACCOUNT_ROLE_ARN }}" >> $GITHUB_ENV
          else
            echo "DEPLOYMENT_ROLE_ARN=${{ secrets.AWS_DEVELOPMENT_ACCOUNT_ROLE_ARN }}" >> $GITHUB_ENV
          fi
          echo "EXTERNAL_ID=${{ secrets.AWS_ASSUME_EXTERNAL_ID }}" >> $GITHUB_ENV
          # Export state account role ARN for Route53/ACM access
          echo "STATE_ACCOUNT_ROLE_ARN=${{ secrets.AWS_STATE_ACCOUNT_ROLE_ARN }}" >> $GITHUB_ENV

      - name: Configure AWS credentials (State Account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STATE_ACCOUNT_ROLE_ARN }}
          role-session-name: GitHubActions-ApplicationProvision-State
          aws-region: ${{ env.AWS_REGION }}

      - name: Create backend_infra backend.hcl from placeholder
        run: |
          # Create backend_infra/backend.hcl if it doesn't exist
          # This is needed for application/providers.tf and application_infra/providers.tf to read backend_infra state configuration
          if [ ! -f "../backend_infra/backend.hcl" ]; then
            cp ../backend_infra/tfstate-backend-values-template.hcl ../backend_infra/backend.hcl
            sed -i -e "s|<BACKEND_BUCKET_NAME>|${{ vars.BACKEND_BUCKET_NAME }}|g" \
            -e "s|<BACKEND_PREFIX>|${{ vars.BACKEND_PREFIX }}|g" \
            -e "s|<AWS_REGION>|${{ env.AWS_REGION }}|g" \
            ../backend_infra/backend.hcl
            echo "Created ../backend_infra/backend.hcl:"
            cat ../backend_infra/backend.hcl
          else
            echo "../backend_infra/backend.hcl already exists. Skipping creation."
          fi

      - name: Create application_infra backend.hcl from placeholder
        run: |
          # Create application_infra/backend.hcl if it doesn't exist
          # This is needed for terraform init in the Check ArgoCD capability status step
          if [ ! -f "../application_infra/backend.hcl" ]; then
            cp ../application_infra/tfstate-backend-values-template.hcl ../application_infra/backend.hcl
            sed -i -e "s|<BACKEND_BUCKET_NAME>|${{ vars.BACKEND_BUCKET_NAME }}|g" \
            -e "s|<APPLICATION_INFRA_PREFIX>|${{ vars.APPLICATION_INFRA_PREFIX }}|g" \
            -e "s|<AWS_REGION>|${{ env.AWS_REGION }}|g" \
            ../application_infra/backend.hcl
            echo "Created ../application_infra/backend.hcl:"
            cat ../application_infra/backend.hcl
          else
            echo "../application_infra/backend.hcl already exists. Skipping creation."
          fi

      - name: Check ArgoCD capability status
        id: check_argocd
        working-directory: ./application_infra
        run: |
          WORKSPACE="${{ env.AWS_REGION }}-${{ inputs.environment }}"

          # Ensure assume-github-role.sh is executable (needed for ArgoCD module external data source)
          chmod +x ./assume-github-role.sh

          # Initialize terraform if needed
          if [ ! -d ".terraform" ]; then
            echo "Initializing application_infra terraform for status check..."
            if ! terraform init -backend-config="backend.hcl"; then
              echo "::error::Failed to initialize application_infra terraform"
              exit 1
            fi
          fi

          # Select workspace
          if ! terraform workspace select "$WORKSPACE"; then
            echo "::error::Failed to select workspace $WORKSPACE in application_infra"
            exit 1
          fi

          # Get ArgoCD capability status output
          ARGOCD_STATUS=$(terraform output -raw argocd_capability_status 2>/dev/null)
          EXIT_CODE=$?

          # Fail if status output command failed
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::ArgoCD capability status not available (failed to retrieve from application_infra)"
            echo "::error::Please ensure ArgoCD capability is deployed in application_infra before deploying applications."
            exit 1
          fi

          # Trim whitespace and set output
          ARGOCD_STATUS=$(echo "$ARGOCD_STATUS" | tr -d '[:space:]')
          echo "status=$ARGOCD_STATUS" >> $GITHUB_OUTPUT

          # Fail if status is empty or null
          if [ -z "$ARGOCD_STATUS" ] || [ "$ARGOCD_STATUS" = "null" ]; then
            echo "::error::ArgoCD capability status is not set or is null"
            echo "::error::Please ensure ArgoCD capability is deployed and active in application_infra before deploying applications."
            exit 1
          fi

          echo "ArgoCD capability status: $ARGOCD_STATUS"

      - name: Validate ArgoCD status
        run: |
          if [ "${{ steps.check_argocd.outputs.status }}" != "ACTIVE" ]; then
            echo "::error::ArgoCD capability status is '${{ steps.check_argocd.outputs.status }}', but expected 'ACTIVE'"
            echo "::error::Please ensure ArgoCD capability is fully deployed and active before deploying applications."
            exit 1
          fi
          echo "✅ ArgoCD capability is ACTIVE - proceeding with deployment"

      - name: Create backend.hcl from placeholder
        run: |
          # Only create if it doesn't exist (matching setup-application.sh behavior)
          if [ ! -f "backend.hcl" ]; then
            cp tfstate-backend-values-template.hcl backend.hcl
            sed -i -e "s|<BACKEND_BUCKET_NAME>|${{ vars.BACKEND_BUCKET_NAME }}|g" \
            -e "s|<APPLICATION_PREFIX>|${{ vars.APPLICATION_PREFIX }}|g" \
            -e "s|<AWS_REGION>|${{ env.AWS_REGION }}|g" \
            backend.hcl
            echo "Created backend.hcl:"
            cat backend.hcl
          else
            echo "backend.hcl already exists. Skipping creation."
          fi

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform workspace
        run: |
          WORKSPACE="${{ env.AWS_REGION }}-${{ inputs.environment }}"
          terraform workspace select $WORKSPACE || terraform workspace new $WORKSPACE

      - name: Terraform validate
        run: terraform validate

      - name: Set Kubernetes environment variables
        run: |
          # set-k8s-env.sh expects State Account credentials to be active for S3 operations
          # It will assume Deployment Account role internally for EKS operations
          # Use the infrastructure's set-k8s-env.sh script (shared between infrastructure and application)
          chmod +x ../application_infra/set-k8s-env.sh
          source ../application_infra/set-k8s-env.sh
          # Export as TF_VAR_ environment variables for Terraform
          echo "TF_VAR_kubernetes_master=$KUBERNETES_MASTER" >> $GITHUB_ENV
          echo "TF_VAR_kube_config_path=$KUBE_CONFIG_PATH" >> $GITHUB_ENV

      - name: Extract image tags from Helm values
        run: |
          # Extract backend image tag
          BACKEND_VALUES_FILE="backend/helm/ldap-2fa-backend/values.yaml"
          if [ ! -f "$BACKEND_VALUES_FILE" ]; then
            echo "::warning::Backend Helm values file not found. Using 'latest' tag."
            echo "TF_VAR_backend_image_tag=latest" >> $GITHUB_ENV
          else
            BACKEND_IMAGE_TAG=$(grep -E '^[[:space:]]*tag:' "$BACKEND_VALUES_FILE" | head -n 1 | sed -E 's/.*tag:[[:space:]]*//' | sed 's/^"//' | sed "s/^'//" | sed 's/"$//' | sed "s/'$//" | tr -d '\r')
            if [ -z "$BACKEND_IMAGE_TAG" ]; then
              echo "::warning::Could not extract backend image tag. Using 'latest'."
              echo "TF_VAR_backend_image_tag=latest" >> $GITHUB_ENV
            else
              echo "TF_VAR_backend_image_tag=$BACKEND_IMAGE_TAG" >> $GITHUB_ENV
              echo "✅ Using backend image tag: $BACKEND_IMAGE_TAG"
            fi
          fi

          # Extract frontend image tag
          FRONTEND_VALUES_FILE="frontend/helm/ldap-2fa-frontend/values.yaml"
          if [ ! -f "$FRONTEND_VALUES_FILE" ]; then
            echo "::warning::Frontend Helm values file not found. Using 'latest' tag."
            echo "TF_VAR_frontend_image_tag=latest" >> $GITHUB_ENV
          else
            FRONTEND_IMAGE_TAG=$(grep -E '^[[:space:]]*tag:' "$FRONTEND_VALUES_FILE" | head -n 1 | sed -E 's/.*tag:[[:space:]]*//' | sed 's/^"//' | sed "s/^'//" | sed 's/"$//' | sed "s/'$//" | tr -d '\r')
            if [ -z "$FRONTEND_IMAGE_TAG" ]; then
              echo "::warning::Could not extract frontend image tag. Using 'latest'."
              echo "TF_VAR_frontend_image_tag=latest" >> $GITHUB_ENV
            else
              echo "TF_VAR_frontend_image_tag=$FRONTEND_IMAGE_TAG" >> $GITHUB_ENV
              echo "✅ Using frontend image tag: $FRONTEND_IMAGE_TAG"
            fi
          fi

      - name: Configure AWS credentials (State Account for Terraform)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STATE_ACCOUNT_ROLE_ARN }}
          role-session-name: GitHubActions-ApplicationProvision-Terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan
        run: terraform plan -var-file="variables.tfvars" -out terraform.tfplan

      - name: Provision application
        run: terraform apply -auto-approve terraform.tfplan
