# High availability configuration with 3 replicas
replicaCount: 3

# Image from ECR
image:
  registry: "${ecr_registry}"
  repository: "${ecr_repository}"
  tag: "${openldap_image_tag}"
  pullPolicy: IfNotPresent

# LDAP domain and organization
ldapDomain: "${openldap_ldap_domain}"
ldapOrganisation: "${openldap_ldap_domain}"

# Use Terraform-managed Kubernetes secret for passwords
existingSecret: "${openldap_secret_name}"

# TLS configuration (osixia auto-generates self-signed certs)
tls:
  enabled: true
  enforce: false
  verifyClient: "never"
  certFilename: "ldap.crt"
  keyFilename: "ldap.key"
  caFilename: "ca.crt"

# osixia native multi-master replication
replication:
  enabled: true
  clusterName: "cluster.local"

# Pass ldapDomain and existingSecret to subcharts via global
global:
  ldapDomain: "${openldap_ldap_domain}"
  existingSecret: "${openldap_secret_name}"

# Persistence
persistence:
  enabled: true
  storageClass: "${storage_class_name}"
  accessModes:
    - ReadWriteOnce
  size: 8Gi

service:
  annotations: {}
  externalIPs: []
  type: ClusterIP
  sessionAffinity: None

# Custom LDIF files to initialize directory structure on all pods.
customLdifFiles:
  01-init-ous.ldif: |-
    # Create users organizational unit
    dn: ou=users,${openldap_base_dn}
    objectClass: organizationalUnit
    ou: users
    description: User accounts

    # Create groups organizational unit
    dn: ou=groups,${openldap_base_dn}
    objectClass: organizationalUnit
    ou: groups
    description: Group definitions

  02-init-groups.ldif: |-
    # Create admins group (groupOfUniqueNames)
    # Initial member is the LDAP admin DN (required by groupOfUniqueNames)
    dn: cn=admins,ou=groups,${openldap_base_dn}
    objectClass: groupOfUniqueNames
    objectClass: top
    cn: admins
    description: Administrator group
    uniqueMember: cn=admin,${openldap_base_dn}

ltb-passwd:
  enabled: true
  image:
    tag: 5.2.3
  podLabels:
    app: "${app_name}"
  env:
    - name: LDAPTLS_REQCERT
      value: "allow"
  ingress:
    enabled: true
    ingressClassName: "${ingress_class_name}"
    annotations:
      alb.ingress.kubernetes.io/load-balancer-name: "${alb_load_balancer_name}"
      alb.ingress.kubernetes.io/target-type: "${alb_target_type}"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/ssl-policy: "${alb_ssl_policy}"
    path: /
    pathType: Prefix
    hosts:
      - "${ltb_passwd_host}"
  ldap:
    bindPWKey: LDAP_ADMIN_PASSWORD

phpldapadmin:
  enabled: true
  env:
    PHPLDAPADMIN_LDAP_CLIENT_TLS_REQCERT: "allow"
  podLabels:
    app: "${app_name}"
  ingress:
    enabled: true
    ingressClassName: "${ingress_class_name}"
    annotations:
      alb.ingress.kubernetes.io/load-balancer-name: "${alb_load_balancer_name}"
      alb.ingress.kubernetes.io/target-type: "${alb_target_type}"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/ssl-policy: "${alb_ssl_policy}"
    path: /
    pathType: Prefix
    hosts:
      - "${phpldapadmin_host}"
