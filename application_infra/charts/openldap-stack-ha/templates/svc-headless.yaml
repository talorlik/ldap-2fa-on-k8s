apiVersion: v1
kind: Service
metadata:
  name: {{ template "openldap.fullname" . }}-headless
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
spec:
  ports:
    - port: 389
      name: ldap-port
      targetPort: ldap-port
  clusterIP: None
  selector:
    {{- include "openldap.selectorLabels" . | nindent 4 }}
  type: ClusterIP
  sessionAffinity: None
