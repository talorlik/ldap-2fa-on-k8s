{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ltb-passwd
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
    {{- with .Values.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  LDAP_ADMIN_PASSWORD: {{ .Values.adminPassword | b64enc | quote }}
{{- end }}
