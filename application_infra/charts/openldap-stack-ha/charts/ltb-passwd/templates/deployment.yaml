apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ltb-passwd.fullname" . }}
  labels:
    {{- include "ltb-passwd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ltb-passwd.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ltb-passwd.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "ltb-passwd.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "ltb-passwd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LDAP_SERVER
              value: ldaps://{{ include "ltb-passwd.ldapServer" . }}:636
            - name: LDAP_BINDDN
              value: {{ include "ltb-passwd.bindDN" . }}
            - name: LDAP_BINDPASS
              valueFrom:
                secretKeyRef:
                  name: {{ template "ltb-passwd.secretName" . }}
                  key: LDAP_ADMIN_PASSWORD
            - name: LDAP_BASE_SEARCH
              value: {{ include "ltb-passwd.baseDomain" . | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
